<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK-117 | C++ Kompilyator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">⚡ TK-117</div>
        <div class="header-controls">
            <select id="langSelect" class="lang-dropdown">
                <option value="az">🇦🇿 AZ</option>
                <option value="tr">🇹🇷 TR</option>
                <option value="en">🇬🇧 EN</option>
                <option value="ru">🇷🇺 RU</option>
            </select>
            <button id="dictionaryBtn" class="dict-btn">📖 <span data-i18n="dict">IT Lüğəti</span></button>
            <div class="hamburger" id="hamburgerBtn">
                <span></span><span></span><span></span>
            </div>
        </div>
        <nav id="navMenu" class="nav-drawer">
            <a href="cpp-rank.html">C++</a>
            <a href="python-rank.html">Python</a>
            <a href="index.html">Common</a>
            <a href="cpp.html" class="active">C++ Compiler</a>
            <a href="python.html">Python Compiler</a>
            <a href="admin.html" class="admin-link">Admin Panel</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h2>Online C++ Kompilyator</h2>
            
            <!-- FAYL YÜKLƏMƏ BÖLMƏSİ (ÇOXLU FAYL ÜÇÜN) -->
            <div style="margin-top: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                <label for="fileUpload" style="background-color: #238636; color: #ffffff; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;">
                    📂 C++ Fayllarını Yüklə (Maks. 10)
                </label>
                <!-- multiple parametri eyni anda birdən çox fayl seçməyə imkan verir -->
                <input type="file" id="fileUpload" accept=".cpp, .txt, .h, .py" multiple style="display: none;">
                <span id="fileCountText" style="color: #8b949e; font-size: 14px; font-weight: bold;">0 / 10 fayl yüklənib</span>
            </div>
            
            <!-- YÜKLƏNƏN FAYLLARIN QUTULARI BURADA YARANACAQ -->
            <div id="fileContainer" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px;"></div>
            
            <iframe src="https://onecompiler.com/embed/cpp?theme=dark" width="100%" height="650px" frameborder="0"></iframe>
        </div>
    </main>

    <!-- IT Lüğəti Modalı -->
    <div id="dictModal" class="modal">
        <div class="modal-content dict-modal-content">
            <span class="close" id="closeDictModal">&times;</span>
            <h3 style="color: #2ea44f; margin-bottom: 10px;">📖 IT Lüğəti (4 Dil)</h3>
            <input type="text" id="dictSearch" placeholder="Termin axtar... (Search term...)" style="margin-bottom: 15px; width: 100%;">
            <div id="dictList" class="dict-list"></div>
        </div>
    </div>

    <!-- FAYL OXUMA, KOPYALAMA VƏ SİLMƏ SKRİPTİ -->
    <script>
        const fileUpload = document.getElementById('fileUpload');
        const fileContainer = document.getElementById('fileContainer');
        const fileCountText = document.getElementById('fileCountText');
        let uploadedFilesCount = 0;

        if (fileUpload) {
            fileUpload.addEventListener('change', function(event) {
                let files = event.target.files;
                if (files.length === 0) return;

                for (let i = 0; i < files.length; i++) {
                    if (uploadedFilesCount >= 10) {
                        alert("Siz artıq maksimum 10 fayl yükləmisiniz! Yenisini əlavə etmək üçün əvvəlcə bəzilərini silin.");
                        break;
                    }

                    let file = files[i];
                    let reader = new FileReader();

                    reader.onload = function(e) {
                        uploadedFilesCount++;
                        fileCountText.innerText = `${uploadedFilesCount} / 10 fayl yüklənib`;

                        // Əsas Qutu
                        let box = document.createElement('div');
                        box.style.background = "#0d1117";
                        box.style.border = "1px solid #30363d";
                        box.style.borderRadius = "6px";
                        box.style.padding = "10px";

                        // Üst hissə (Ad və Düymələr)
                        let headerDiv = document.createElement('div');
                        headerDiv.style.display = "flex";
                        headerDiv.style.justifyContent = "space-between";
                        headerDiv.style.alignItems = "center";
                        headerDiv.style.marginBottom = "10px";
                        headerDiv.style.flexWrap = "wrap";
                        headerDiv.style.gap = "10px";

                        let fileName = document.createElement('span');
                        fileName.innerText = "📄 " + file.name;
                        fileName.style.color = "#58a6ff";
                        fileName.style.fontWeight = "bold";

                        // Düymələrin qutusu
                        let actionsDiv = document.createElement('div');
                        actionsDiv.style.display = "flex";
                        actionsDiv.style.gap = "8px";

                        let copyBtn = document.createElement('button');
                        copyBtn.innerText = "📋 Kopyala";
                        copyBtn.style.padding = "6px 12px";
                        copyBtn.style.background = "#21262d";
                        copyBtn.style.color = "#c9d1d9";
                        copyBtn.style.border = "1px solid #30363d";
                        copyBtn.style.borderRadius = "6px";
                        copyBtn.style.cursor = "pointer";

                        let deleteBtn = document.createElement('button');
                        deleteBtn.innerText = "🗑️ Sil";
                        deleteBtn.style.padding = "6px 12px";
                        deleteBtn.style.background = "rgba(218, 54, 51, 0.1)";
                        deleteBtn.style.color = "#ff7b72";
                        deleteBtn.style.border = "1px solid #da3633";
                        deleteBtn.style.borderRadius = "6px";
                        deleteBtn.style.cursor = "pointer";

                        actionsDiv.appendChild(copyBtn);
                        actionsDiv.appendChild(deleteBtn);
                        headerDiv.appendChild(fileName);
                        headerDiv.appendChild(actionsDiv);

                        // Mətn Xanası (Textarea)
                        let textArea = document.createElement('textarea');
                        textArea.value = e.target.result;
                        textArea.rows = 5;
                        textArea.readOnly = true;
                        textArea.style.width = "100%";
                        textArea.style.background = "#161b22";
                        textArea.style.color = "#e6edf3";
                        textArea.style.border = "1px solid #30363d";
                        textArea.style.borderRadius = "4px";
                        textArea.style.padding = "10px";
                        textArea.style.fontFamily = "monospace";
                        textArea.style.resize = "vertical";

                        // Kopyalama Funksiyası
                        copyBtn.onclick = function() {
                            textArea.select();
                            navigator.clipboard.writeText(textArea.value).then(() => {
                                copyBtn.innerText = "✅ Kopyalandı!";
                                copyBtn.style.color = "#3fb950";
                                copyBtn.style.borderColor = "#3fb950";
                                setTimeout(() => {
                                    copyBtn.innerText = "📋 Kopyala";
                                    copyBtn.style.color = "#c9d1d9";
                                    copyBtn.style.borderColor = "#30363d";
                                }, 2000);
                            });
                        };

                        // Silmə Funksiyası
                        deleteBtn.onclick = function() {
                            box.remove();
                            uploadedFilesCount--;
                            fileCountText.innerText = `${uploadedFilesCount} / 10 fayl yüklənib`;
                        };

                        box.appendChild(headerDiv);
                        box.appendChild(textArea);
                        fileContainer.appendChild(box);
                    };

                    reader.onerror = function() {
                        alert("Xəta: " + file.name + " oxunmadı!");
                    };

                    reader.readAsText(file);
                }
                event.target.value = ""; // Eyni faylı təkrar seçmək üçün sıfırlama
            });
        }
    </script>

    <script type="module" src="app.js"></script>
</body>
</html>
