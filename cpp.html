<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK-117 | C++ Kompilyator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">⚡ TK-117</div>
        <div class="header-controls">
            <select id="langSelect" class="lang-dropdown">
                <option value="az">🇦🇿 AZ</option>
                <option value="tr">🇹🇷 TR</option>
                <option value="en">🇬🇧 EN</option>
                <option value="ru">🇷🇺 RU</option>
            </select>
            <button id="dictionaryBtn" class="dict-btn">📖 <span data-i18n="dict">IT Lüğəti</span></button>
            <div class="hamburger" id="hamburgerBtn">
                <span></span><span></span><span></span>
            </div>
        </div>
        <nav id="navMenu" class="nav-drawer">
            <a href="cpp-rank.html">C++</a>
            <a href="python-rank.html">Python</a>
            <a href="index.html">Common</a>
            <a href="cpp.html" class="active">C++ Compiler</a>
            <a href="python.html">Python Compiler</a>
            <a href="admin.html" class="admin-link">Admin Panel</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h2>Online C++ Kompilyator</h2>
            
            <!-- FAYL YÜKLƏMƏ BÖLMƏSİ (YENİ) -->
            <div style="margin-top: 15px; margin-bottom: 15px;">
                <label for="fileUpload" style="background-color: #238636; color: #ffffff; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;">
                    📂 C++ Faylı Yüklə (.cpp)
                </label>
                <input type="file" id="fileUpload" accept=".cpp, .txt, .py" style="display: none;">
            </div>
            
            <!-- KODUN GÖZÜKƏCƏYİ YER (YENİ) -->
            <textarea id="codeViewer" rows="8" style="width: 100%; display: none; background: #0d1117; color: #58a6ff; padding: 10px; border: 1px solid #30363d; border-radius: 6px; margin-bottom: 15px; font-family: monospace;" readonly placeholder="Kod burada görünəcək... Kopyalayıb aşağıya yapışdırın."></textarea>
            
            <iframe src="https://onecompiler.com/embed/cpp?theme=dark" width="100%" height="650px" frameborder="0"></iframe>
        </div>
    </main>

    <!-- IT Lüğəti Modalı -->
    <div id="dictModal" class="modal">
        <div class="modal-content dict-modal-content">
            <span class="close" id="closeDictModal">&times;</span>
            <h3 style="color: #2ea44f; margin-bottom: 10px;">📖 IT Lüğəti (4 Dil)</h3>
            <input type="text" id="dictSearch" placeholder="Termin axtar... (Search term...)" style="margin-bottom: 15px; width: 100%;">
            <div id="dictList" class="dict-list"></div>
        </div>
    </div>

    <!-- FAYL OXUMA SKRİPTİ (YENİ) -->
    <script>
        const fileUpload = document.getElementById('fileUpload');
        const codeViewer = document.getElementById('codeViewer');

        if (fileUpload) {
            fileUpload.addEventListener('change', function(event) {
                let file = event.target.files[0];
                if (!file) return;

                let reader = new FileReader();
                reader.onload = function(e) {
                    codeViewer.value = e.target.result;
                    codeViewer.style.display = "block"; // Fayl seçiləndə xananı göstər
                };
                reader.onerror = function() {
                    alert("Faylı oxumaq mümkün olmadı!");
                };
                reader.readAsText(file);
                event.target.value = ""; 
            });
        }
    </script>

    <script type="module" src="app.js"></script>
</body>
</html>
