<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK-117 | Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">⚡ TK-117</div>
        <nav>
            <a href="cpp-rank.html">C++</a>
            <a href="python-rank.html">Python</a>
            <a href="index.html">Common</a>
            <a href="cpp.html">C++ Compiler</a>
            <a href="python.html">Python Compiler</a>
            <a href="admin.html" class="active admin-link">Admin Panel</a>
        </nav>
    </header>

    <main>
        <!-- Giriş Formu -->
        <div id="loginSection" class="card">
            <h2>Admin Girişi</h2>
            <form id="loginForm">
                <input type="text" id="adminUsername" placeholder="İstifadəçi Adı (Elsad / Aytac)" required>
                <input type="password" id="adminPassword" placeholder="Şifrə" required>
                <button type="submit">Daxil ol</button>
            </form>
        </div>

        <!-- Yönetim Paneli (Giriş yapıldıktan sonra görünür) -->
        <div id="adminPanel" class="card hidden">
            <h2>Tələbəyə Həftəlik Bal Əlavə Et / Yenilə</h2>
            <form id="addStudentForm">
                <input type="text" id="studentName" placeholder="Tələbənin Adı və Soyadı" required>
                <input type="number" id="weekNum" placeholder="Həftə Nömrəsi (Məs: 1, 2, 3...)" required>
                <input type="number" id="cppPoints" placeholder="C++ Balı" value="0" required>
                <input type="number" id="pythonPoints" placeholder="Python Balı" value="0" required>
                <button type="submit">Balı Əlavə Et / Yenilə</button>
            </form>

            <hr style="margin: 25px 0; border-color: #30363d;">

            <h2 style="color: #da3633;">Tələbə / Bal Sil</h2>
            <form id="deleteStudentForm">
                <input type="text" id="deleteStudentName" placeholder="Silinəcək Tələbənin Adı və Soyadı" required>
                <button type="submit" style="background-color: #da3633;" id="deleteBtnText">Tələbəni Sil</button>
            </form>

            <button id="logoutBtn" class="logout-btn">Çıxış Et</button>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
